services:
  postgres:
    image: timescale/timescaledb:latest-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    restart: unless-stopped
    environment:
      POSTGRES_USER: pegana
      POSTGRES_PASSWORD: pegana
      POSTGRES_DB: pegana
    ports: ["5433:5432"]   # 5433 on host (avoid clash with system postgres) → 5432 in container
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pegana"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    restart: unless-stopped
    ports: ["6380:6379"]   # 6380 on host (avoid clash with system redis if any) → 6379 in container
    volumes: [redisdata:/data]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: {}
  redisdata: {}
